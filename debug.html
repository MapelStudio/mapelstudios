<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>AR Debug</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
    }
    .a-canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1 !important;
      background: transparent !important;
    }
    video {
      z-index: 0 !important;
    }
  </style>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="external/runtime/runtime.js"></script>
  <script src="external/xr/xr.js" data-preload-chunks="slam"></script>
  <script src="js/xrextras.js"></script>
  <script>
    window.addEventListener('xrloaded', () => {
      console.log("XR ready – configuring targets");
      XR8.XrController.configure({
        imageTargetData: [
          {
            name: "target-a",
            imagePath: "./data/Ajpg.jpeg",
            type: "PLANAR",
            metadata: {},
            properties: {
              left: 0, top: 0,
              width: 2157, height: 1039,
              originalWidth: 2157, originalHeight: 1039,
              isRotated: false
            }
          }
        ]
      });
    });

    window.addEventListener('xrimagefound', (e) => {
      console.log("✅ IMAGE FOUND:", e.detail.name);
      // Show a temporary UI message
      const msg = document.createElement('div');
      msg.textContent = "Target found!";
      msg.style.position = "fixed";
      msg.style.bottom = "20px";
      msg.style.left = "20px";
      msg.style.background = "green";
      msg.style.color = "white";
      msg.style.padding = "10px";
      msg.style.zIndex = "9999";
      document.body.appendChild(msg);
      setTimeout(() => msg.remove(), 3000);
    });

    window.addEventListener('xrimagelost', (e) => {
      console.log("❌ IMAGE LOST:", e.detail.name);
    });
  </script>
</head>
<body>
  <a-scene
    xrweb="disableWorldTracking: true"
    xrextras-loading
    xrextras-runtime-error
    renderer="colorManagement: true; antialias: true;"
  >
    <a-camera></a-camera>

    <!-- World-space cube – should always be visible -->
    <a-box color="blue" position="0 1 -2" scale="1 1 1" rotation="0 45 0">
      <a-animation attribute="rotation" dur="5000" repeat="indefinite" to="360 45 0" easing="linear"></a-animation>
    </a-box>

    <!-- Target-anchored red box – should appear over the detected image -->
    <xrextras-named-image-target name="target-a">
      <a-entity>
        <a-box color="red" position="0 0 0.05" scale="0.2 0.2 0.02">
          <a-animation attribute="rotation" dur="2000" repeat="indefinite" to="0 360 0" easing="linear"></a-animation>
        </a-box>
      </a-entity>
    </xrextras-named-image-target>
  </a-scene>
</body>
</html>
