<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>AR Test - Box on Target</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="external/runtime/runtime.js"></script>
  <script src="external/xr/xr.js" data-preload-chunks="slam"></script>
  <script src="js/xrextras.js"></script>
  <script>
    // Wait for XR engine to be ready before configuring targets
    window.addEventListener('xrloaded', () => {
      console.log("XR ready – configuring targets");
      XR8.XrController.configure({
        imageTargetData: [
          {
            name: "target-a",
            imagePath: "./data/Ajpg.jpeg",
            type: "PLANAR",
            metadata: {},
            properties: {
              left: 0,
              top: 0,
              width: 2157,
              height: 1039,
              originalWidth: 2157,
              originalHeight: 1039,
              isRotated: false
            }
          }
        ]
      });
    });
  </script>
</head>
<body style="margin: 0; overflow: hidden;">
  <a-scene
    xrweb="disableWorldTracking: true"
    xrextras-loading
    xrextras-runtime-error
    renderer="colorManagement: true; antialias: true;"
  >
    <a-camera></a-camera>

    <!-- Image target: a simple box that should float over the detected image -->
    <xrextras-named-image-target name="target-a">
      <a-entity>
        <!-- A visible box: red, size 0.2 units, raised slightly above the image -->
        <a-box color="red" position="0 0 0.05" scale="0.2 0.2 0.02" material="opacity: 1"></a-box>
        <!-- Add a rotating animation so you can see movement -->
        <a-animation attribute="rotation" dur="5000" repeat="indefinite" to="0 360 0" easing="linear"></a-animation>
      </a-entity>
    </xrextras-named-image-target>
  </a-scene>
</body>
</html>
