    <div id="debug" style="position:fixed; top:70px; left:10px; background:rgba(0,0,0,0.8); color:lime; padding:10px; z-index:99999; font-size:11px; max-width:90%; overflow:auto; max-height:200px;"></div>

    <div id="loading-screen" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 99999; background-color: #000; overflow: hidden;">
        <div style="position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);">
            <model-viewer src="assets/ringanimation.glb" autoplay camera-orbit="-90deg 90deg auto" style="width: 100px; height: 100px; background: transparent;"></model-viewer>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
  // Force hide loading screen after 3 seconds, no matter what
  setTimeout(function() {
    var loadingScreen = document.getElementById('loading-screen');
    if (loadingScreen) {
      loadingScreen.style.display = 'none';
      document.getElementById('debug').innerHTML += '<br>⚠️ Loading screen forced hidden (timeout)';
    }
  }, 3000);
</script>

    <script>
  // Catch all errors and show them in the #debug div
  window.onerror = function(msg, url, line, col, error) {
    var debugDiv = document.getElementById('debug');
    if (debugDiv) {
      debugDiv.innerHTML += '<br><span style="color:red">ERROR: ' + msg + ' at line ' + line + '</span>';
    }
    return false;
  };
  console.log = function(msg) {
    var debugDiv = document.getElementById('debug');
    if (debugDiv) debugDiv.innerHTML += '<br>' + msg;
  };
</script>
