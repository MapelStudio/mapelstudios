<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapel Studios AR</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/fcor/arjs-gestures@master/dist/gestures.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.2.0/dist/aframe-extras.min.js"></script>
</head>
<body>

    <div id="ui">
    

    <img src="assets/logo.png" class="main-logo" alt="Mapel Studios Logo" draggable="false" oncontextmenu="return false;">
    <div class="logo-text">Axis Of Wonders</div>
    <button class="btn" id="start-btn">
    <svg class="btn-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456ZM16.894 20.567 16.5 21.75l-.394-1.183a2.25 2.25 0 0 0-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 0 0 1.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 0 0 1.423 1.423l1.183.394-1.183.394a2.25 2.25 0 0 0-1.423 1.423Z"
      ></path>
    </svg>

    <div class="txt-wrapper">
    <div class="txt-1">
        <span class="btn-letter">E</span><span class="btn-letter">x</span>
        <span class="btn-letter">p</span><span class="btn-letter">e</span>
        <span class="btn-letter">r</span><span class="btn-letter">i</span>
        <span class="btn-letter">e</span><span class="btn-letter">n</span>
        <span class="btn-letter">c</span><span class="btn-letter">e</span>
        <span class="btn-letter">&nbsp;</span> <span class="btn-letter">A</span><span class="btn-letter">R</span>
    </div>
    <div class="txt-2">
        <span class="btn-letter">E</span><span class="btn-letter">x</span>
        <span class="btn-letter">p</span><span class="btn-letter">e</span>
        <span class="btn-letter">r</span><span class="btn-letter">i</span>
        <span class="btn-letter">e</span><span class="btn-letter">n</span>
        <span class="btn-letter">c</span><span class="btn-letter">e</span>
        <span class="btn-letter">&nbsp;</span>
        <span class="btn-letter">A</span><span class="btn-letter">R</span>
    </div>
</div>
  </button>
</div>

    <div id="icon-layer" style="display: none;">
        <div class="round-btn" id="btn-left"><img src="assets/left-button.png" alt="Menu"></div>
        <div class="round-btn" id="btn-right"><img src="assets/right-button.png" alt="Settings"></div>
        <div id="horse-menu" class="horse-ui" style="display: none;">
    <div id="anim-drawer" class="anim-drawer">
        <button class="anim-btn sub-btn" onclick="playAnim('idle')">Idle</button>
        <button class="anim-btn sub-btn" onclick="playAnim('run')">Run</button>
        <button class="anim-btn sub-btn" onclick="playAnim('walk')">Walk</button>
    </div>
    
    <button class="anim-btn main-trigger" onclick="toggleAnimMenu()">
        Animations
    </button>
</div>
    </div>

    <div id="scanner-container" style="display: none;">
        <div class="target-box">
            <div class="corner tl"></div><div class="corner tr"></div>
            <div class="corner bl"></div><div class="corner br"></div>
        </div>
        <div class="status-label">ALIGN TARGET WITHIN CORNERS</div>
    </div>
<div id="tutorial-modal" class="tutorial-overlay">
  <div class="tutorial-glass-card">
    <button class="close-x" id="close-tutorial-btn">&times;</button>

    <div class="tutorial-page active" id="page-1">
      <div class="tutorial-art"><img src="assets/welcome-illustration.png" alt="Welcome"></div>
      <h2 class="tutorial-title">Welcome</h2>
      <p class="tutorial-text">How to see AR-photo?</p>
    </div>

    <div class="tutorial-page" id="page-2">
      <div class="tutorial-art"><img src="assets/qr-illustration.png" alt="QR Code"></div>
      <h2 class="tutorial-title">QR-code</h2>
      <p class="tutorial-text">Point the camera at the QR code<br>to add your photos</p>
    </div>

    <div class="tutorial-page" id="page-3">
      <div class="tutorial-art"><img src="assets/ar-illustration.png" alt="AR Photo"></div>
      <h2 class="tutorial-title">AR-photo</h2>
      <p class="tutorial-text">Now point the camera at the photo.<br>It becomes alive!</p>
    </div>
  </div>

  <div class="tutorial-nav">
    <button class="tutorial-btn" id="nav-btn-next" onclick="handleNext()">Next</button>
    <div class="page-indicator">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</div>

    <div class="page-indicator">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</div>
    <a-scene 
    id="sceneEl"
mindar-image="imageTargetSrc: ./data/targets (1).mind; autoStart: false; uiScanning: no; ui: no; filterMinCF: 0.001; filterBeta: 0.01;"
embedded 
color-space="sRGB" 
renderer="colorManagement: true;"
xr-mode-ui="enabled: false" 
device-orientation-permission-ui="enabled: false">
        
        <a-assets>
        <a-asset-item id="model-a" src="assets/apple.glb"></a-asset-item>
        <a-asset-item id="model-b" src="assets/ball.glb"></a-asset-item>
        <a-asset-item id="model-c" src="assets/cat.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target-a" class="alphabet-target" mindar-image-target="targetIndex: 0">
        <a-gltf-model src="#model-a" rotation="90 0 0" position="0 0 0" scale="0.5 0.5 0.5" animation-mixer touch-rotate></a-gltf-model>
    </a-entity>

    <a-entity id="target-b" class="alphabet-target" mindar-image-target="targetIndex: 1">
        <a-gltf-model src="#model-b" rotation="90 0 0" position="0 0 0" scale="0.5 0.5 0.5" animation-mixer touch-rotate></a-gltf-model>
    </a-entity>

    <a-entity id="target-c" class="alphabet-target" mindar-image-target="targetIndex: 2">
        <a-gltf-model src="#model-c" rotation="90 0 0" position="0 0 0" scale="0.5 0.5 0.5" animation-mixer touch-rotate></a-gltf-model>
    </a-entity>
    </a-scene>

    <video autoplay muted loop playsinline id="bg-video" oncontextmenu="return false;" disablePictureInPicture>
    <source src="assets/landing-bg.mp4" type="video/mp4">
</video>
    <div id="debug" style="position:fixed; top:70px; left:10px; background:rgba(0,0,0,0.8); color:lime; padding:10px; z-index:99999; font-size:11px; max-width:90%; overflow:auto; max-height:200px;"></div>
    <script src="js/main.js"></script>

    
</body>
</html>
