<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mapel Studios AR</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- First load A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- Then load 8th Wall Engine -->
    <script src="external/runtime/runtime.js"></script>
    <script src="external/xr/xr.js" data-preload-chunks="slam"></script>
    
    <!-- Then load xrextras (this provides xrextras-named-image-target) -->
    <script src="js/xrextras.js"></script>
    
    <!-- Additional components -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.2.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/fcor/arjs-gestures@master/dist/gestures.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    
    <!-- Your custom scripts LAST -->
    <script src="js/xr.js"></script>
    <script src="js/main.js"></script>

    <script>
        // Add error handling for script loading
        window.addEventListener('error', function(e) {
            console.error('Script loading error:', e.target.src || e.target.href, e);
        });
        
        window.addEventListener('xrloaded', () => {
            console.log("XR engine loaded successfully");
        });
        
        window.addEventListener('xrerror', (event) => {
            console.error("XR error:", event.detail);
        });
        
        // Wait for everything to be ready
        window.addEventListener('load', function() {
            console.log("All resources loaded");
        });
    </script>
</head>
<body>
    <!-- Your body content remains the same -->
    <div id="ui">
        <img src="assets/logo.png" class="main-logo" alt="Mapel Studios Logo">
        <button class="btn" id="start-btn">
            <svg class="btn-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456ZM16.894 20.567 16.5 21.75l-.394-1.183a2.25 2.25 0 0 0-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 0 0 1.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 0 0 1.423 1.423l1.183.394-1.183.394a2.25 2.25 0 0 0-1.423 1.423Z"></path>
            </svg>
            <div class="txt-wrapper">
                <div class="txt-1">
                    <span class="btn-letter">E</span><span class="btn-letter">x</span><span class="btn-letter">p</span><span class="btn-letter">e</span><span class="btn-letter">r</span><span class="btn-letter">i</span><span class="btn-letter">e</span><span class="btn-letter">n</span><span class="btn-letter">c</span><span class="btn-letter">e</span><span class="btn-letter">&nbsp;</span><span class="btn-letter">A</span><span class="btn-letter">R</span>
                </div>
                <div class="txt-2">
                    <span class="btn-letter">E</span><span class="btn-letter">x</span><span class="btn-letter">p</span><span class="btn-letter">e</span><span class="btn-letter">r</span><span class="btn-letter">i</span><span class="btn-letter">e</span><span class="btn-letter">n</span><span class="btn-letter">c</span><span class="btn-letter">e</span><span class="btn-letter">&nbsp;</span><span class="btn-letter">A</span><span class="btn-letter">R</span>
                </div>
            </div>
        </button>
    </div>

    <!-- Rest of your body content... -->
    
    <a-scene
        id="sceneEl"
        xrweb="disableWorldTracking: true"
        xrextras-loading
        xrextras-runtime-error
        renderer="colorManagement: true; antialias: true;">
        
        <a-assets>
            <a-asset-item id="apple" src="assets/apple.glb"></a-asset-item>
            <a-asset-item id="bag" src="assets/bag.glb"></a-asset-item>
            <a-asset-item id="emerald" src="assets/emerald.glb"></a-asset-item>
            <a-asset-item id="flower" src="assets/flower.glb"></a-asset-item>
            <a-asset-item id="gift" src="assets/gift.glb"></a-asset-item>
            <!-- Add other models as needed -->
        </a-assets>

        <a-camera></a-camera>

        <xrextras-named-image-target name="target-a">
            <a-entity id="target-a-anchor" position="0 0 0">
                <a-gltf-model id="target-a-display" src="#apple" position="0 0 0" scale="0.045 0.045 0.045"></a-gltf-model>
            </a-entity>
        </xrextras-named-image-target>
        
        <xrextras-named-image-target name="target-b">
            <a-entity id="target-b-anchor" position="0 0 0">
                <a-gltf-model id="target-b-display" src="#bag" position="0 0 0" scale="1 1 1"></a-gltf-model>
            </a-entity>
        </xrextras-named-image-target>
        
        <!-- Add other targets -->
    </a-scene>
    
    <div id="error-log" style="position:fixed; bottom:0; left:0; background:black; color:red; z-index:99999; font-size:10px; width:100%; height:50px; overflow:scroll;"></div>
    
    <script>
        // Global error handler
        window.onerror = function(msg, url, line, col, error) {
            const errorMsg = `${line}: ${msg}`;
            console.error(errorMsg);
            const errorLog = document.getElementById('error-log');
            if (errorLog) {
                errorLog.innerHTML += errorMsg + "<br>";
            }
            return false;
        };
        
        // Check if xrextras is loaded
        setTimeout(() => {
            console.log("Checking xrextras:", typeof XRExtras);
            console.log("Checking scene:", document.getElementById('sceneEl'));
        }, 1000);
    </script>
</body>
</html>
